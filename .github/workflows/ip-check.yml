name: IP & Similarity Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  clean-room-similarity:
    name: Clean-Room Token Shingle & Identifier Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Clean-Room & Token Similarity Audit
        run: npm run ip:check

  scancode-audit:
    name: ScanCode License & Copyright Origin Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ScanCode Toolkit
        run: pip install "pluggy<1.6.0" scancode-toolkit

      - name: Scan source tree for third-party copyright or non-permissive licenses
        run: |
          scancode --license --copyright --json-pp scancode-report.json packages/ examples/ tools/ schema/ LICENSE
          python3 -c '
          import json, sys
          data = json.load(open("scancode-report.json"))
          for f in data.get("files", []):
              for det in f.get("license_detections", []):
                  expr = det.get("license_expression_spdx", "")
                  if "Proprietary" in expr or "Commercial" in expr:
                      fpath = f.get("path")
                      print(f"Disallowed license expression in {fpath}: {expr}")
                      sys.exit(1)
          print("ScanCode check passed with zero disallowed license detections.")
          '

  dependency-review:
    name: GitHub Dependency License Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, MPL-2.0
